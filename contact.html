<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.png" />

    <title>Contact Us — VIYO | VividVista International</title>
    <meta
      name="description"
      content="Get in touch with VIYO (VividVista International) — request a quote for hotel & resort amenities, RFID door locks, minibars, or contact our sales team directly."
    />
    <meta name="keywords" content="VIYO contact, VIYO India, VIYO hotel amenities, Viyo International, VividVista contact, hotel supplies quote" />

    <link rel="canonical" href="https://www.viyoindia.com/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VIYO — VividVista International" />
    <meta property="og:title" content="Contact Us — VIYO | VividVista International" />
    <meta property="og:description" content="Get in touch with VIYO (VividVista International) — request a quote for hotel & resort amenities, RFID door locks, minibars, or contact our sales team directly." />
    <meta property="og:url" content="https://www.viyoindia.com/contact.html" />
    <meta property="og:image" content="https://www.viyoindia.com/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Contact Us — VIYO | VividVista International" />
    <meta name="twitter:description" content="Get in touch with VIYO (VividVista International) — request a quote for hotel & resort amenities, RFID door locks, minibars, or contact our sales team directly." />
    <meta name="twitter:image" content="https://www.viyoindia.com/favicon.png" />

    <link rel="stylesheet" href="/styles.min.css?v=114" />
    <link rel="stylesheet" href="/css/tailwind.min.css?v=114" />

    <!-- Config + theme init must run before paint, before Tailwind/Alpine -->
    <script src="/js/min/config.min.js?v=114"></script>
    <script src="/js/min/theme-init.min.js?v=114"></script>

    <!-- Deferred non-critical head scripts -->
    <script src="/js/min/analytics.min.js?v=114" defer></script>
    <script src="/js/min/color-utils.min.js?v=114" defer></script>
    <script src="/js/min/image-protect.min.js?v=114" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="/css/viyo-theme.min.css?v=114" />
  </head>

  <body x-data="{}" class="font-body text-ink bg-gradient-to-b from-[#f4faf0] via-[#d5ecc4] to-[#eaf6e1] dark:from-[#0e1611] dark:via-[#16251b] dark:to-[#0d1510] min-h-screen antialiased transition-colors duration-500 relative" style="font-family: 'Inter', sans-serif;">
    <div class="fixed top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[400px] bg-[#93C572]/25 dark:bg-[#93C572]/20 rounded-full blur-[120px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-1/4 right-1/4 translate-y-1/2 w-[550px] h-[350px] bg-[#6fa847]/20 dark:bg-[#6fa847]/15 rounded-full blur-[110px] pointer-events-none -z-10"></div>
<div id="site-header"></div>
    <script src="/js/min/header.min.js?v=114"></script>

    <main x-data="catalog">
      <!-- ============ PAGE TITLE ============ -->
      <section class="relative px-6 pt-36 pb-16 md:pt-44 md:pb-20 overflow-hidden bg-gradient-to-b from-neutral-900/5 via-[#93C572]/5 to-transparent dark:from-neutral-950 dark:via-neutral-900/40 dark:to-neutral-950">
        <div class="max-w-3xl mx-auto text-center relative z-10" data-reveal>
          <span class="inline-block font-label text-xs uppercase tracking-[0.25em] px-4 py-1.5 rounded-full bg-[#93C572]/20 backdrop-blur-md text-[#93C572] border border-[#93C572]/30 mb-4 shadow-lg shadow-[#93C572]/10">
            Get In Touch
          </span>
          <h1 class="font-display font-semibold text-4xl sm:text-6xl text-neutral-900 dark:text-white tracking-tight mb-4" data-reveal data-text-reveal>Contact Us</h1>
          <p class="text-base sm:text-xl text-neutral-600 dark:text-neutral-300 leading-relaxed max-w-xl mx-auto font-light">
            Tell us about your property and the pieces you're specifying — our team replies with a quote within one business day.
          </p>
        </div>
      </section>

      <!-- ============ CONTACT INFO + INQUIRY FORM ============ -->
      <section id="inquire" class="relative px-6 py-16 lg:py-24 overflow-hidden">
        <div class="max-w-6xl mx-auto grid lg:grid-cols-[minmax(0,320px)_1fr] gap-8 items-start">
          
          <!-- Contact Info Card (3D Glass) -->
          <div class="group relative rounded-3xl bg-white/70 dark:bg-neutral-900/70 backdrop-blur-2xl border border-white/60 dark:border-neutral-800 p-8 flex flex-col gap-8 shadow-[0_20px_50px_rgba(0,0,0,0.08)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.5)] transform-gpu hover:shadow-[0_25px_60px_rgba(147,197,114,0.18)] transition-all duration-500" data-reveal>
            <div>
              <p class="font-label text-xs uppercase tracking-wider text-[#93C572] font-bold mb-2.5 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                Phone
              </p>
              <template x-for="number in SITE.contact.phones" :key="number">
                <a :href="`tel:${number}`" class="block text-xl font-bold text-neutral-900 dark:text-white hover:text-[#93C572] transition-colors mb-1" x-text="number"></a>
              </template>
            </div>
            <div>
              <p class="font-label text-xs uppercase tracking-wider text-[#93C572] font-bold mb-2.5 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 6-10 7L2 6"></path></svg>
                Email
              </p>
              <p class="flex flex-wrap items-center gap-x-2 text-base font-semibold text-neutral-900 dark:text-white">
                <template x-for="(address, index) in SITE.contact.emails" :key="address">
                  <span class="inline-flex items-center gap-x-2">
                    <a :href="`mailto:${address}`" class="hover:text-[#93C572] transition-colors" x-text="address"></a>
                    <span x-show="index < SITE.contact.emails.length - 1" class="opacity-40" aria-hidden="true">/</span>
                  </span>
                </template>
              </p>
            </div>
            <div>
              <p class="font-label text-xs uppercase tracking-wider text-[#93C572] font-bold mb-2.5 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                Address
              </p>
              <p class="text-sm leading-relaxed text-neutral-600 dark:text-neutral-300" x-text="SITE.contact.location"></p>
            </div>
            <a :href="SITE.contact.whatsapp" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-2.5 px-6 py-3.5 rounded-2xl bg-[#93C572] text-neutral-950 font-label text-xs uppercase tracking-wider font-bold hover:bg-[#82B860] transition-all hover:scale-105 shadow-lg shadow-[#93C572]/20">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.33 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.35-.53.06-1.02.24-3.45-.72-2.91-1.16-4.75-4.14-4.9-4.33-.14-.19-1.17-1.56-1.17-2.98 0-1.42.74-2.11 1-2.4.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.58.81 2 .88 2.15.07.15.12.32.02.52-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.75 1.24 1.62 2.01 1.11 1 2.05 1.31 2.34 1.46.29.15.46.12.63-.07.17-.19.72-.84.92-1.13.19-.29.38-.24.65-.14.26.1 1.68.79 1.97.94.29.14.48.21.55.33.07.12.07.68-.17 1.36z"/></svg>
              Chat on WhatsApp
            </a>
          </div>

          <!-- Form Card (3D Glass) -->
          <div x-data="inquiryForm" class="rounded-3xl bg-white/80 dark:bg-neutral-900/80 backdrop-blur-2xl border border-white/60 dark:border-neutral-800 p-8 md:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.08)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.5)]" data-reveal data-reveal-delay="1">
            <template x-if="success">
              <div class="text-center py-8">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-[#93C572]/20 border border-[#93C572]/40 flex items-center justify-center text-[#93C572]">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-8 h-8">
                    <path d="M20 6L9 17l-5-5"></path>
                  </svg>
                </div>
                <h3 class="font-display text-2xl font-semibold text-neutral-900 dark:text-white mb-2">Inquiry sent.</h3>
                <p class="text-neutral-500 dark:text-neutral-400 text-base mb-6">We've received your message and will reply within one business day.</p>
                <button type="button" @click="success = false" class="font-label text-xs uppercase tracking-wider text-[#93C572] font-bold hover:underline">
                  Send another inquiry
                </button>
              </div>
            </template>

            <form
              x-show="!success" @submit.prevent="submit()" class="space-y-6" novalidate
            >

              <div class="grid sm:grid-cols-2 gap-6">
                <div>
                  <label class="block font-label text-xs uppercase tracking-wider font-semibold text-neutral-500 dark:text-neutral-400 mb-2">Full Name</label>
                  <input
                    type="text" x-model="form.name" name="name" required
                    @blur="validate()"
                    class="w-full px-4 py-3.5 rounded-2xl bg-white/70 dark:bg-neutral-800/70 border border-neutral-200 dark:border-neutral-700 outline-none focus:border-[#93C572] focus:ring-2 focus:ring-[#93C572]/20 transition-all text-neutral-900 dark:text-white"
                    :class="errors.name ? 'border-red-500' : ''"
                    placeholder="Jordan Blake"
                  />
                  <p x-show="errors.name" x-cloak class="text-xs mt-1.5 text-red-500" x-text="errors.name"></p>
                </div>
                <div>
                  <label class="block font-label text-xs uppercase tracking-wider font-semibold text-neutral-500 dark:text-neutral-400 mb-2">Email</label>
                  <input
                    type="email" x-model="form.email" name="email" required
                    @blur="validate()"
                    class="w-full px-4 py-3.5 rounded-2xl bg-white/70 dark:bg-neutral-800/70 border border-neutral-200 dark:border-neutral-700 outline-none focus:border-[#93C572] focus:ring-2 focus:ring-[#93C572]/20 transition-all text-neutral-900 dark:text-white"
                    :class="errors.email ? 'border-red-500' : ''"
                    placeholder="jordan@property.com"
                  />
                  <p x-show="errors.email" x-cloak class="text-xs mt-1.5 text-red-500" x-text="errors.email"></p>
                </div>
              </div>

              <div class="grid sm:grid-cols-2 gap-6">
                <div>
                  <label class="block font-label text-xs uppercase tracking-wider font-semibold text-neutral-500 dark:text-neutral-400 mb-2">Phone (optional)</label>
                  <input
                    type="tel" x-model="form.phone" name="phone"
                    maxlength="10" inputmode="numeric" pattern="[0-9]*"
                    @input="form.phone = form.phone.replace(/\D/g, '').slice(0, 10)"
                    @blur="validate()"
                    class="w-full px-4 py-3.5 rounded-2xl bg-white/70 dark:bg-neutral-800/70 border border-neutral-200 dark:border-neutral-700 outline-none focus:border-[#93C572] focus:ring-2 focus:ring-[#93C572]/20 transition-all text-neutral-900 dark:text-white"
                    :class="errors.phone ? 'border-red-500' : ''"
                    placeholder="9876543210"
                  />
                  <p x-show="errors.phone" x-cloak class="text-xs mt-1.5 text-red-500" x-text="errors.phone"></p>
                </div>
                <div>
                  <label class="block font-label text-xs uppercase tracking-wider font-semibold text-neutral-500 dark:text-neutral-400 mb-2">Products of Interest</label>
                  <div class="relative" @click.outside="productDropdownOpen = false">
                    <input type="hidden" name="product" :value="form.product" />
                    <button
                      type="button"
                      @click="productDropdownOpen = !productDropdownOpen"
                      class="w-full min-h-[50px] px-4 py-2.5 rounded-2xl bg-white/70 dark:bg-neutral-800/70 border border-neutral-200 dark:border-neutral-700 focus:border-[#93C572] outline-none transition-all flex flex-wrap items-center gap-1.5 text-left text-neutral-900 dark:text-white"
                    >
                      <template x-if="selectedProducts.length === 0">
                        <span class="text-neutral-400 text-sm py-0.5">Select products…</span>
                      </template>
                      <template x-for="name in selectedProducts" :key="name">
                        <span class="inline-flex items-center gap-1.5 bg-[#93C572]/20 text-[#93C572] text-xs font-label uppercase tracking-wide px-3 py-1 rounded-full border border-[#93C572]/30">
                          <span x-text="name"></span>
                          <span
                            @click.stop="toggleProduct(name)"
                            class="w-4 h-4 flex items-center justify-center rounded-full hover:bg-[#93C572]/30 cursor-pointer leading-none"
                            aria-label="Remove"
                          >&times;</span>
                        </span>
                      </template>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 ml-auto text-neutral-400 flex-none transition-transform duration-200" :class="productDropdownOpen ? 'rotate-180' : ''">
                        <path d="m6 9 6 6 6-6"></path>
                      </svg>
                    </button>

                    <div
                      x-show="productDropdownOpen"
                      x-transition:enter="transition ease-out duration-150"
                      x-transition:enter-start="opacity-0 translate-y-1"
                      x-transition:enter-end="opacity-100 translate-y-0"
                      x-cloak
                      class="absolute z-30 mt-2 w-full rounded-2xl bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 p-3 shadow-2xl flex flex-col"
                    >
                      <input
                        type="search"
                        x-model="productSearch"
                        placeholder="Search products…"
                        aria-label="Search products"
                        class="w-full px-3 py-2 mb-2 rounded-xl bg-neutral-100 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 outline-none text-sm text-neutral-900 dark:text-white"
                      />
                      <div class="overflow-y-auto space-y-1 max-h-52">
                        <template x-for="product in products.filter((p) => p.name.toLowerCase().includes(productSearch.trim().toLowerCase()))" :key="product.slug">
                          <label class="flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-[#93C572]/15 cursor-pointer text-sm text-neutral-800 dark:text-neutral-200 transition-colors">
                            <input
                              type="checkbox"
                              :checked="selectedProducts.includes(product.name)"
                              @change="toggleProduct(product.name)"
                              class="w-4 h-4 rounded accent-[#93C572]"
                            />
                            <span x-text="product.name"></span>
                          </label>
                        </template>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div>
                <label class="block font-label text-xs uppercase tracking-wider font-semibold text-neutral-500 dark:text-neutral-400 mb-2">Message</label>
                <textarea
                  x-model="form.message" name="message" rows="4"
                  class="w-full px-4 py-3.5 rounded-2xl bg-white/70 dark:bg-neutral-800/70 border border-neutral-200 dark:border-neutral-700 outline-none focus:border-[#93C572] focus:ring-2 focus:ring-[#93C572]/20 transition-all text-neutral-900 dark:text-white resize-none"
                  placeholder="Quantities, room count, timeline…"
                ></textarea>
              </div>

              <div class="flex items-center justify-between gap-4 flex-wrap pt-2">
                <span class="text-xs text-neutral-500 dark:text-neutral-400">Typical response time: 1 - 2 business days</span>
                <button type="submit" :disabled="submitting" class="inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-full bg-[#93C572] text-neutral-950 font-label text-xs uppercase tracking-wider font-bold hover:bg-[#82B860] transition-all hover:scale-105 shadow-xl shadow-[#93C572]/20 disabled:opacity-60">
                  <span x-show="!submitting">Submit Inquiry &rarr;</span>
                  <span x-show="submitting">Sending…</span>
                </button>
              </div>

              <p x-show="error" x-cloak class="text-sm text-center text-red-500">
                Something went wrong. Please try again or email <span x-text="SITE.contact.email"></span> directly.
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- ============ FOOTER (shared component — see js/footer.js) ============ -->
    <div id="site-footer"></div>
    <script src="/js/footer.js?v=114"></script>

    <!-- ============ BACK TO TOP ============ -->
    <div
      x-data="{ visible: false }"
      x-init="let ticking = false; window.addEventListener('scroll', () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { visible = window.scrollY > 600; ticking = false; }); }, { passive: true })"
      x-show="visible"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-2"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 translate-y-2"
      x-cloak
      class="fixed bottom-6 right-6 z-40"
    >
      <button
        type="button"
        @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
        aria-label="Back to top"
        class="w-12 h-12 rounded-full bg-accent text-on-accent flex items-center justify-center shadow-lg hover:scale-110 transition-transform"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
          <path d="M12 19V5M5 12l7-7 7 7"></path>
        </svg>
      </button>
    </div>

    <script src="/js/min/app.min.js?v=114"></script>
    <script src="/js/min/motion.min.js?v=114"></script>
    <script src="/js/min/alpine.min.js?v=114" defer></script>
  </body>
</html>
